# JASCA v1.1.1 — namespace jasca(미리 생성되어 있어야 함)에 설치합니다.
# 먼저 postgres.yaml(또는 사내 DB)을 준비한 뒤 적용하세요.
# 신규 설치: JASCA_BOOTSTRAP_PASSWORD와 Ingress host를 수정하세요.
# 프로젝트, 스캔 결과, 사용자, 설정은 PostgreSQL에 있고, Trivy DB와 업로드 작업 폴더는 PVC jasca-data(/data)에 있습니다.
# 백업은 DB와 PVC를 함께 받아야 합니다(원본 보고서는 DB에, PVC에는 Trivy DB와 대기 중인 스캔 업로드가 있습니다).
apiVersion: v1
kind: Secret
metadata:
  name: jasca-secrets
  namespace: jasca
type: Opaque
stringData:
  # 빈 DB에서 처음 시작할 때만 admin 계정을 이 비밀번호로 만듭니다(12~72자 ASCII). 이후에는 웹에서 바꾸세요.
  # 12자 미만이면 앱이 시작하지 않으므로 반드시 바꿔야 합니다.
  JASCA_BOOTSTRAP_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jasca-config
  namespace: jasca
data:
  JASCA_ADDR: "0.0.0.0:8080"
  JASCA_DATA_DIR: "/data" # Trivy DB(/data/trivy)와 스캔 작업 폴더(/data/work) 위치(아래 PVC)
  JASCA_TZ: "Asia/Seoul" # 화면에 보이는 시간대
  # 비밀번호는 URL에 넣지 않고 아래 PGPASSWORD(Secret)로 전달합니다.
  # pool_max_conns는 앱이 DB에 여는 최대 연결 수입니다. 사내 DB의 max_connections 한도 안에서 조정하세요.
  # sslmode=require는 구간을 암호화합니다(postgres.yaml이 켠 TLS). 외부 DB는 sslmode=verify-full&sslrootcert=/경로 로 바꾸세요.
  JASCA_DATABASE_URL: "postgres://jasca@jasca-postgres:5432/jasca?sslmode=require&pool_max_conns=20"
  JASCA_MAX_SESSIONS: "3" # 계정당 동시 접속 수. 넘으면 가장 오래 쓰지 않은 접속을 끊습니다. 0이면 제한 없음.
  JASCA_SESSION_IDLE_MIN: "30" # 이 시간(분) 동안 브라우저 요청이 없으면 세션을 끝냅니다. 0이면 끕니다.
  JASCA_MAX_REPORT_MB: "50" # 스캔 결과 보고서(JSON/SARIF 등) 업로드 상한
  JASCA_MAX_SCAN_UPLOAD_MB: "2048" # Trivy 스캔용 파일/이미지 업로드 상한. Ingress proxy-body-size와 함께 조정하세요.
  JASCA_MAX_EXTRACT_MB: "4096" # 압축 해제 후 총 크기 상한
  JASCA_TRIVY_BIN: "/usr/local/bin/trivy"
  JASCA_SCAN_TIMEOUT_MIN: "15" # 스캔 1건의 제한 시간(관리 → Trivy DB의 스캔 옵션에서 정하면 그 값이 우선)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jasca-data
  namespace: jasca
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName: your-storage-class # 클러스터 기본 StorageClass를 쓰지 않을 때 지정
  resources:
    requests:
      storage: 30Gi # Trivy DB 1~2GB + 스캔 작업 폴더(압축 해제 상한 4GiB)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasca
  namespace: jasca
spec:
  # 스캔 큐와 세션 처리가 한 프로세스를 전제로 하므로 1개로만 실행 (늘리지 마세요)
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate # 교체 중에 Pod가 둘 떠 있지 않게 합니다(PVC도 RWO).
  selector:
    matchLabels: { app: jasca }
  template:
    metadata:
      labels: { app: jasca }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001 # /data 볼륨을 앱 사용자가 쓸 수 있게 합니다.
        fsGroupChangePolicy: OnRootMismatch # 시작할 때마다 PVC 전체를 chown하지 않습니다(느린 스토리지에서 startup probe 초과 방지).
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jasca
          image: jasca:v1.1.1 # 레지스트리를 쓰면 경로 변경
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - secretRef: { name: jasca-secrets }
            - configMapRef: { name: jasca-config }
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: jasca-postgres-secrets, key: POSTGRES_PASSWORD }
            - { name: TMPDIR, value: /tmp } # Trivy 임시 파일(쓰기 가능한 emptyDir)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi } # Trivy 스캔이 메모리를 많이 씁니다.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: jasca-data }
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi # Trivy 임시 폴더
---
apiVersion: v1
kind: Service
metadata:
  name: jasca
  namespace: jasca
spec:
  type: ClusterIP
  selector: { app: jasca }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jasca
  namespace: jasca
  annotations:
    # 스캔 파일/이미지 업로드(기본 상한 2GiB)가 통과하도록 본문 크기와 제한 시간을 늘립니다 (ingress-nginx 기준).
    # JASCA_MAX_SCAN_UPLOAD_MB를 바꾸면 proxy-body-size도 함께 바꾸세요. 다른 프록시도 같은 조건을 맞추세요.
    # 서버는 Origin과 Host가 같은지 검사하므로 Host 헤더를 바꾸지 마세요.
    nginx.ingress.kubernetes.io/ssl-redirect: "true" # HTTP로 들어오면 HTTPS로 돌립니다.
    nginx.ingress.kubernetes.io/proxy-body-size: "2100m" # 앱 상한 2GiB + multipart 머리말 여유, 그래야 초과 시 앱의 한국어 안내가 보입니다.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off" # 2GiB 업로드를 컨트롤러 디스크에 먼저 쌓지 않고 바로 넘깁니다.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  # ingressClassName: your-ingress-class
  # TLS는 클러스터 기본 설정(공용 인증서/LB)에 맡깁니다. Host와 X-Forwarded-Proto를 보존해야 합니다.
  rules:
    - host: jasca.example.internal # 실제 주소로 변경
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: jasca, port: { number: 80 } }
